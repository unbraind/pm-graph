name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded PR runs; manual runs stay independent.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Required checks stay on fast GitHub-hosted hardware.
    runs-on: ubuntu-latest
    # Bound quick-tier work and hung subprocesses on hosted slots.
    timeout-minutes: 25
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      # Checkout must precede this first decision. NUL delimiters handle unusual
      # filenames; compare the actual PR endpoints, not the synthetic merge commit.
      # Disable rename folding so moving source into docs still counts its deletion.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable sources and committed artifacts need all source gates.
                dist/*|*.mjs|*.cjs|*.js|*.ts|*.tsx|*.mts|*.cts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Install project pm-github extension
        shell: bash
        run: bash scripts/install-pm-github.sh

      - name: Verify tracked pm project health
        if: steps.changes.outputs.code != 'true' || matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          timeout --signal=TERM --kill-after=10s 120s ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      # No standalone markdown linter exists. These small suites enforce the
      # existing README/example, package metadata and public commit contracts.
      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          npm run changelog:check
          npm run verify:release-publish-attestation
          npm run build
          node --test test/package-metadata.test.ts test/manifest-vocabulary.test.ts test/identity-audit.test.ts
          node --test --test-concurrency=2 test/analytics-direction.test.ts test/snapshot-impact.test.ts test/snapshot-impact-command.test.ts test/export-and-contract.test.ts test/read-output-host.test.ts
          npm pack --dry-run --ignore-scripts

      - name: Build and verify committed output is current
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          # Every flag below is load-bearing. Do not simplify any of them without
          # reading why it is here; each one was a way this gate silently passed.
          #
          #   'dist/' with the trailing slash — cosmetic, not corrective. A bare
          #     `dist` pathspec does NOT match dist-test/; git pathspecs match whole
          #     path components, so `dist` matches the dist directory and nothing
          #     else. An earlier revision of this comment claimed otherwise and was
          #     wrong (caught in review on pm-web#76). The slash is kept only
          #     because it states the intent at a glance.
          #   --error-unmatch + exit 1 — an untracked dist/ used to skip the gate.
          #     This package is installed by copying the repository, so untracked
          #     build output is the defect, not an exemption from checking for it.
          #   rm -rf dist — tsc never removes output for a deleted source, so an
          #     orphaned artifact survived every rebuild and every comparison.
          #   git status, not git diff — `git diff --quiet` cannot see a NEW file at
          #     all, so a newly generated artifact was invisible to it.
          #   --untracked-files=all — without it a new file inside a tracked
          #     directory is reported as the directory, not the file.
          #   --ignored=matching — some packages gitignore a dist/ whose contents
          #     git tracks; there a new artifact is invisible to plain git status
          #     too, so one .gitignore line would have disabled this gate forever.
          #     'matching' rather than plain --ignored keeps the report scoped to the
          #     pathspec instead of listing node_modules.
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Engines floor tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      # Packed acceptance is a separate manual script here, not part of release:check.
      - name: Verify Bun can install the package graph
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: |
          bun install --no-save
          bun --eval "await import('./dist/index.js')"
          bunx --no-install pm --version

  windows-prepare-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PM_TEST_DEPTH: quick
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The pinned kit's Git prepare uses an extensionless POSIX compiler shim.
      # Use its committed build here, then exercise this package's own prepare
      # through npm/cmd.exe. Linux jobs retain full dependency lifecycles.
      - name: Install locked dependencies for Windows lifecycle checks
        # npm 10 still prepares some Git dependencies with --ignore-scripts.
        run: npx --yes npm@11.17.0 ci --ignore-scripts

      - name: Run the package prepare lifecycle through npm
        run: npm run prepare

      - name: Verify the prepare lifecycle registered the merge drivers
        run: npx pm health --strict-exit --require-merge-drivers

      - name: Exercise the real Windows command parser
        run: node --test test/windows-prepare.integration.ts

      - name: Verify Windows coverage paths with real glob and completion receipts
        run: node --test "--test-name-pattern=path comparison|Windows-shaped|coverage gate passes a complete real suite" test/coverage-gate.test.ts
