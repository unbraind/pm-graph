name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # `--strict-exit` is load-bearing: non-strict health may report findings while
          # still exiting successfully.
          timeout --signal=TERM --kill-after=10s 120s ./node_modules/.bin/pm health --strict-exit

      - name: Type check
        run: npm run typecheck

      - name: Build and verify committed output is current
        shell: bash
        run: |
          set -euo pipefail
          # Every flag below is load-bearing. Do not simplify any of them without
          # reading why it is here; each one was a way this gate silently passed.
          #
          #   'dist/' with the trailing slash — cosmetic, not corrective. A bare
          #     `dist` pathspec does NOT match dist-test/; git pathspecs match whole
          #     path components, so `dist` matches the dist directory and nothing
          #     else. An earlier revision of this comment claimed otherwise and was
          #     wrong (caught in review on pm-web#76). The slash is kept only
          #     because it states the intent at a glance.
          #   --error-unmatch + exit 1 — an untracked dist/ used to skip the gate.
          #     This package is installed by copying the repository, so untracked
          #     build output is the defect, not an exemption from checking for it.
          #   rm -rf dist — tsc never removes output for a deleted source, so an
          #     orphaned artifact survived every rebuild and every comparison.
          #   git status, not git diff — `git diff --quiet` cannot see a NEW file at
          #     all, so a newly generated artifact was invisible to it.
          #   --untracked-files=all — without it a new file inside a tracked
          #     directory is reported as the directory, not the file.
          #   --ignored=matching — some packages gitignore a dist/ whose contents
          #     git tracks; there a new artifact is invisible to plain git status
          #     too, so one .gitignore line would have disabled this gate forever.
          #     'matching' rather than plain --ignored keeps the report scoped to the
          #     pathspec instead of listing node_modules.
          if ! git ls-files --error-unmatch 'dist/' > /dev/null 2>&1; then
            echo "::error::dist/ is not tracked. This package is installed by copying the repository, so the build output has to be in git."
            exit 1
          fi
          rm -rf dist
          npm run build
          drift=$(git status --porcelain=v1 --untracked-files=all --ignored=matching -- 'dist/')
          if [ -n "$drift" ]; then
            echo "::error::Committed dist/ does not match a fresh build. Run 'npm run build' and commit the result."
            printf '%s\n' "$drift"
            exit 1
          fi
          echo "Committed dist/ matches a fresh build."

      - name: Test with coverage gate
        run: npm run coverage

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Verify npm package contents
        run: npm run pack:dry-run

      - name: Verify generated changelog
        run: npm run changelog:check

      - name: Verify Bun can install the package graph
        run: bun install --no-save

  windows-prepare-lifecycle:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # npm ci runs the production prepare lifecycle through cmd.exe before the
      # adversarial fixture below exercises spaces and percent-delimited paths.
      - name: Install dependencies and merge drivers
        run: npm ci

      - name: Exercise the real Windows command parser
        run: node --test test/windows-prepare.integration.ts
